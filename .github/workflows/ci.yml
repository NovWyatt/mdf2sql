# Chạy bộ test mỗi khi push hoặc mở pull request.
# Chạy trên Windows vì công cụ dành cho Windows và vài test kiểm tra đường dẫn kiểu Windows.
# Test dùng pyodbc và tkinter giả (tests/fake_*), nên không cần cài SQL Server hay pyodbc.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Chạy test
        run: python -m unittest discover -s tests -t . -v
